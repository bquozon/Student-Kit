{% extends "base.html" %}
{% block title %}Log in · Swiss Student Kit{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<main class="wrap page">
  <h1>Moderation</h1>
  {% if error %}<p class="flash" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/mod/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="key">Admin key</label>
    <input id="key" name="key" type="password" required autocomplete="current-password" autofocus>
    <p><button class="btn">Log in</button></p>
  </form>
</main>
{% endblock %}
